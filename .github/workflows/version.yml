name: Notifications
on:
  push:
    branches: [main]

jobs:
  notification:
    if: ${{ github.repository_owner == 'WaspScripts' }}
    runs-on: ubuntu-latest
    steps:
      - name: Discord notification
        shell: bash
        env:
          MSG: ${{ github.event.head_commit.message }}
          SHA: ${{ github.event.head_commit.id }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          WEBHOOK: ${{ secrets.UPDATES_WEBHOOK }}
        run: |
          BODY=$(jq -nc \
            --arg title "API Update" \
            --arg desc "$MSG" \
            --arg url  "https://github.com/WaspScripts/wasp-api/commit/$SHA" \
            --arg foot "Author: $AUTHOR" \
            --argjson color 16742912 \
            '{embeds:[{title:$title,description:$desc,url:$url,color:$color,footer:{text:$foot}}]}')
          curl -sS -H "Content-Type: application/json" -d "$BODY" "$WEBHOOK"
